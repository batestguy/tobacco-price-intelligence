name: publish-model

# Pushes fine-tuned FinBERT weights to the HF Hub with the repo's HF_TOKEN secret.
#
# A Kaggle run submitted with the CLI cannot attach that secret, so the notebook
# saves the weights as its output instead of pushing them. They reach this job
# one of two ways:
#
#   urls  a JSON object {filename: url} of the Kaggle output's signed download
#         URLs. The runner fetches them directly, so ~440 MB never crosses the
#         submitting machine's connection. Preferred.
#   tag   a GitHub Release holding finbert-ng-financial.tar.gz.
#
#   gh workflow run publish-model.yml -f urls="$(cat urls.json)"
#   gh workflow run publish-model.yml -f tag=finbert-ng-v1
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "JSON {filename: signed Kaggle output URL}"
        required: false
      tag:
        description: "Or: release tag holding finbert-ng-financial.tar.gz"
        required: false
      repo_id:
        description: "HF Hub model repo to push to"
        default: "batestguy/finbert-ng-financial"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch the weights
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        # The signed URLs are read from the event payload, never interpolated
        # into this script, and masked before use: this is a public repo's log.
        run: |
          mkdir model
          urls=$(jq -r '.inputs.urls // ""' "$GITHUB_EVENT_PATH")
          if [ -n "$urls" ]; then
            jq -r '.inputs.urls | fromjson | .[]' "$GITHUB_EVENT_PATH" |
              while read -r u; do echo "::add-mask::$u"; done
            jq -r '.inputs.urls | fromjson | to_entries[] | .key + " " + .value' "$GITHUB_EVENT_PATH" |
              while read -r name u; do
                curl -sSfL --retry 5 --retry-all-errors -o "model/$(basename "$name")" "$u"
              done
          elif [ -n "$TAG" ]; then
            gh release download "$TAG" --repo "$REPO" --pattern finbert-ng-financial.tar.gz
            tar -xzf finbert-ng-financial.tar.gz -C model --strip-components=1
          else
            echo "::error::Pass either urls or tag."
            exit 1
          fi
          ls -la model

      - name: Check it is a sequence-classification checkpoint
        # Refuse to publish anything the scorer could not load: a config with the
        # three FinBERT labels, and weights next to it.
        run: |
          python - <<'PY'
          import json, pathlib
          cfg = json.loads(pathlib.Path("model/config.json").read_text())
          labels = {v.lower() for v in cfg["id2label"].values()}
          assert labels == {"positive", "negative", "neutral"}, labels
          assert any(pathlib.Path("model").glob("*.safetensors")), "no weights"
          print("ok:", cfg["id2label"])
          PY

      - name: Push to the Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REPO_ID: ${{ inputs.repo_id }}
        run: |
          pip install --quiet huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          repo = os.environ["REPO_ID"]
          api.create_repo(repo, repo_type="model", exist_ok=True)
          info = api.upload_folder(folder_path="model", repo_id=repo, repo_type="model",
                                   commit_message="Fine-tuned FinBERT (Kaggle run)")
          print("pushed:", info.commit_url)
          PY
