name: scrape

# 06:00 and 18:00 WAT. WAT is UTC+1 year round (no DST), so 05:00/17:00 UTC.
# Cron here is best-effort -- GitHub delays scheduled runs under load and can
# occasionally fire twice. Every write is an upsert keyed on the row's natural
# key, so a late or duplicated run is harmless.
on:
  schedule:
    - cron: "0 5,17 * * *"
  workflow_dispatch:

# Required for the commit-back step. Without it the push fails with a 403 that
# reads like an auth problem.
permissions:
  contents: write

concurrency:
  # Two overlapping scrapes would race on the same Parquet partition and the
  # loser's commit would be rejected. Queue instead.
  group: data-write
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-actions.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-actions.txt

      - name: Cache NLTK data
        uses: actions/cache@v4
        with:
          path: ~/nltk_data
          key: nltk-vader-v1

      - name: Run scrapers
        env:
          PYTHONPATH: src
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m tobacco.jobs.scrape

      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/curated
          if git diff --staged --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: scrape $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Another data job may have pushed while this one ran; rebase onto it
          # rather than failing. Both only ever touch their own partitions.
          git pull --rebase --autostash origin ${GITHUB_REF_NAME}
          git push
