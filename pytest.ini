; Test configuration lives here rather than in pyproject.toml: the package is
; deliberately not installable. The workflows run it as `PYTHONPATH=src python -m
; tobacco.jobs.<name>`, and `pythonpath = src` below is the pytest equivalent, so
; the suite imports exactly what the jobs import.
;
; Note there is no global `filterwarnings = error`. The one warning this suite
; cares about (the pandas regex-group warning behind TAX_TERMS) is asserted
; locally with warnings.catch_warnings(); making every warning fatal would turn
; the build red on the next pandas release for reasons unrelated to this repo.
[pytest]
testpaths = tests
pythonpath = src
addopts = -ra --tb=short --strict-markers
